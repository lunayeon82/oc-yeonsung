<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랜덤 뽑기</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a89ec4">
<link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/assets/pwa.js" defer></script>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/modal.css">
<style>
  @font-face {
    font-family: 'ko-font';
    src: url('assets/ko-font.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body); background: var(--page-gradient); background-attachment: fixed;
    color: var(--text); min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .app {
    position: relative; z-index: 1;
    max-width: 1220px; margin: 0 auto;
    padding: 20px 16px 20px;
  }

  /* Loading */
  .loading { text-align: center; padding: 60px 0; color: var(--text-dim); font-size: 0.9rem; }
  .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 2.5px solid var(--border); border-top-color: var(--pink); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ Layout ============ */
  .layout { display: block; }
  .pool-col { min-width: 0; }

  /* ============ Pool top (sticky on mobile) ============ */
  .pool-top-sticky { background: transparent; }

  .pool-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .pool-tab {
    flex: 1 1 auto; min-width: 86px;
    padding: 9px 6px; text-align: center;
    font-family: var(--font-title); font-weight: 700;
    font-size: 0.82rem; cursor: pointer;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text-dim);
    transition: all 0.2s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .pool-tab:hover { border-color: var(--text-dim); color: var(--text); }
  .pool-tab.active { border-color: var(--violet); color: var(--violet); background: var(--violet-dim); }
  .pool-tab .src {
    font-size: 0.62rem; font-weight: 500; opacity: 0.75;
  }
  .pool-tab .src.is-custom {
    display: inline-block; padding: 1px 7px; border-radius: 100px;
    background: var(--violet); color: #fff; opacity: 1; font-weight: 700;
  }

  /* ============ Segmented switch + import ============ */
  .override-row {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px; padding: 8px 10px;
    background: none; border: 1px solid var(--border); border-radius: 10px;
    font-size: 0.78rem;
  }
  .seg-switch { display: flex; border: 1px solid var(--border); border-radius: 100px; overflow: hidden; }
  .seg-btn {
    padding: 6px 12px; border: none; background: var(--surface); color: var(--text-dim);
    font-family: var(--font-body); font-size: 0.75rem; font-weight: 600; cursor: pointer;
    transition: all 0.18s;
  }
  .seg-btn.active { background: var(--violet); color: #fff; }
  .import-select {
    padding: 5px 10px; border-radius: 100px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-dim); font-size: 0.75rem; font-family: var(--font-body);
    cursor: pointer;
  }
  .import-select:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ============ Filters + counter ============ */
  .filters-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding: 0 4px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .fbtn {
    padding: 5px 12px; border-radius: 100px;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 0.73rem; font-weight: 600;
    cursor: pointer; font-family: var(--font-body); transition: all 0.18s;
  }
  .fbtn:hover { border-color: var(--text-dim); color: var(--text); }
  .fbtn.active { border-color: var(--violet); background: var(--violet-dim); color: var(--violet); }

  .pool-counter { display: flex; align-items: center; gap: 8px; font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; }
  .pool-counter b { color: var(--violet); }
  .pool-counter .cat-toggle {
    padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 0.65rem; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap;
  }
  .pool-counter .cat-toggle:hover { border-color: var(--text-dim); color: var(--text); }

  .category { margin-bottom: 24px; }
  .cat-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .cat-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--violet); }
  .cat-title { font-family: var(--font-title); font-weight: 800; font-size: 1.1rem; }

  .owner-block { margin-bottom: 16px; }
  .owner-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-left: 4px; flex-wrap: wrap; }
  .owner-name { font-family: var(--font-title); font-weight: 700; font-size: 0.95rem; }
  .owner-count { font-size: 0.68rem; color: var(--text-muted); }
  .owner-toggle {
    margin-left: auto; padding: 4px 10px; border-radius: 100px; border: 1px solid var(--border);
    background: none; color: var(--text-dim); font-size: 0.65rem; cursor: pointer;
    font-family: var(--font-body); white-space: nowrap;
  }
  .owner-toggle:hover { border-color: var(--text-dim); color: var(--text); }

  .sub-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .sub-label { flex-shrink: 0; width: 60px; padding: 5px 0; font-size: 0.73rem; font-weight: 600; color: var(--text-dim); text-align: right; line-height: 1.9; }
  .sub-items { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }

  .ch {
    padding: 6px 14px; border-radius: 100px;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 0.8rem; font-weight: 600;
    cursor: pointer; font-family: var(--font-body);
    transition: all 0.18s; user-select: none;
    display: inline-flex; align-items: center;
  }
  .ch:hover { border-color: var(--text-dim); color: var(--text); }
  .ch.on { border-color: var(--violet); background: var(--violet-dim); color: var(--text); font-weight: 700; box-shadow: 0 0 12px var(--violet-dim); }
  .ch .chk { display: none; margin-right: 4px; color: var(--violet); }
  .ch.on .chk { display: inline-flex; }
  .ch.filtered-out { opacity: 0.25; pointer-events: none; }
  .ch .tag { display: inline-flex; align-items: center; gap: 2px; font-size: 0.55rem; margin-left: 3px; vertical-align: middle; opacity: 0.6; }
  .ch .tag .heart { color: var(--rose); opacity: 1; }
  .ch-readonly { cursor: default; opacity: 0.75; }
  .ch-readonly:hover { border-color: var(--border); color: var(--text-dim); }

  .empty { color: var(--text-muted); font-size: 0.8rem; padding: 8px 0 0 4px; }

  /* ============ Panel (desktop sticky / mobile bottom sheet) ============ */
  .panel {
    background: var(--surface-glass); backdrop-filter: blur(8px); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 16px 16px;
    position: relative; overflow: hidden;
    margin-top: 24px;
  }
  .panel::after {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%); width: 60%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), var(--violet), transparent);
  }
  .sheet-handle { display: none; }

  .count-select { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
  .count-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 600; }
  .count-btns { display: flex; gap: 6px; }
  .count-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-family: var(--font-title); font-weight: 700;
    font-size: 0.85rem; cursor: pointer; transition: all 0.18s;
  }
  .count-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .count-btn.active { border-color: var(--violet); background: var(--violet-dim); color: var(--violet); box-shadow: 0 0 10px rgba(167,139,250,0.2); }

  .pick-counts {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    font-size: 0.75rem; color: var(--text-dim); margin-bottom: 16px; text-align: center;
  }

  .result-coupling {
    display: flex; align-items: flex-start; justify-content: center;
    gap: 10px; min-height: 48px; margin-bottom: 12px; flex-wrap: wrap;
  }
  .result-slot { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .result-side { font-family: var(--font-title); font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; min-width: 50px; text-align: center; }
  .result-side .ph { color: var(--text-muted); font-weight: 400; font-size: 0.85rem; }
  .result-x { font-family: var(--font-title); font-weight: 800; font-size: 1.1rem; color: var(--violet); opacity: 0.7; align-self: center; margin-top: 6px; }
  .result-pop { animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .result-badge {
    font-size: 0.6rem; font-weight: 600; padding: 1px 7px; border-radius: 100px;
    background: var(--surface2); color: var(--text-muted); white-space: nowrap;
  }
  .result-badge.is-custom { background: var(--violet-dim); color: var(--violet); }

  .result-subs { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .result-sub-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .result-sub-label { flex-shrink: 0; font-size: 0.7rem; font-weight: 600; color: var(--text-muted); min-width: 44px; text-align: right; }
  .result-role-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
  .result-sub-value { font-family: var(--font-title); font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; min-width: 40px; text-align: center; }
  .result-sub-value .ph { color: var(--text-muted); font-weight: 400; font-size: 0.8rem; }
  .result-role-sep { color: var(--violet); opacity: 0.7; font-weight: 800; font-size: 0.9rem; margin: 0 2px; }
  .result-role-text { color: var(--amber); }
  .result-au-text { color: var(--mint); }

  .reroll-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .reroll-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 100px;
    border: 1px solid var(--violet); background: var(--violet-dim);
    color: var(--violet); font-size: 0.7rem; font-weight: 600;
    cursor: pointer; font-family: var(--font-body); transition: all 0.18s;
  }
  .reroll-btn:hover { background: var(--violet); color: #fff; }
  .reroll-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .action-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
  .action-row .pick-btn { order: -1; flex-basis: 100%; }

  .pick-btn {
    padding: 12px 44px; border: none; border-radius: 100px;
    background: linear-gradient(135deg, var(--pink), var(--violet));
    color: #fff; font-family: var(--font-title);
    font-size: 1.05rem; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(192,137,158,0.25);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .pick-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(192,137,158,0.35); }
  .pick-btn:active { transform: scale(0.97); }
  .pick-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .icon-action {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 100px; border: 1px solid var(--violet);
    background: var(--violet-dim); color: var(--violet);
    font-size: 0.75rem; font-weight: 600; cursor: pointer;
    font-family: var(--font-body); transition: all 0.18s;
  }
  .icon-action:hover { background: var(--violet); color: #fff; }

  .history-card { border-top: 1px solid var(--border); padding-top: 12px; margin-bottom: 16px; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .history-title { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); }
  .history-clear { background: none; border: 1px dashed var(--border); color: var(--text-muted); font-size: 0.65rem; padding: 3px 8px; border-radius: 100px; cursor: pointer; font-family: var(--font-body); }
  .history-clear:hover { border-color: var(--rose); color: var(--rose); }
  .history { display: flex; gap: 6px; flex-wrap: wrap; min-height: 24px; }
  .history-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 100px; background: var(--violet-dim); border: 1px solid var(--violet); font-size: 0.67rem; color: var(--violet); animation: chipIn 0.25s ease; cursor: pointer; transition: all 0.18s; }
  .history-chip:hover { background: var(--violet); color: #fff; }
  .history-chip:active { transform: scale(0.95); }
  .reroll-badge { font-size: 0.58rem; font-weight: 700; padding: 0 5px; border-radius: 100px; background: var(--violet); color: #fff; }
  .history-chip:hover .reroll-badge { background: #fff; color: var(--violet); }
  @keyframes chipIn { 0%{transform:scale(0)} 100%{transform:scale(1)} }
  .sheet-collapsed-hint { display: none; background: none; border: none; padding: 4px 0; margin-bottom: 10px; width: 100%; text-align: center; font-family: var(--font-body); }

  .list-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .list-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 100px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-dim); font-size: 0.75rem; font-weight: 600;
    cursor: pointer; font-family: var(--font-body); transition: all 0.18s;
  }
  .list-btn:hover { border-color: var(--text-dim); color: var(--text); }

  .icon-inline { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav-corner-right .action-pill { display: inline-flex; align-items: center; gap: 5px; }

  .ptcl { position: fixed; width: 5px; height: 5px; border-radius: 50%; pointer-events: none; z-index: 200; animation: fly 0.7s ease-out forwards; }
  @keyframes fly { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }

  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 18px; border-radius: 100px;
    font-size: 0.8rem; z-index: 300;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ============ Desktop (≥960px): 2-col grid, sticky right panel ============ */
  @media (min-width: 960px) {
    .layout { display: grid; grid-template-columns: 1fr 420px; gap: 28px; align-items: start; }
    .pool-col { padding-left: 100px; } /* clears the personal-nav widget fixed at bottom-left */
    .panel {
      position: sticky; top: 24px; margin-top: 0;
      max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .action-row .icon-action .btn-label { display: inline; }
    .history-card { display: block !important; }
  }

  /* ============ Mobile (<960px): sticky top filters, bottom-sheet panel ============ */
  @media (max-width: 959px) {
    .pool-top-sticky {
      position: sticky; top: 0; z-index: 40;
      background: var(--surface-glass-strong, rgba(250,247,242,0.92));
      backdrop-filter: blur(10px);
      padding: 10px 0 4px;
      margin: 0 -12px;
      padding-left: 12px; padding-right: 12px;
    }
    .panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
      margin: 0; border-radius: 18px 18px 0 0;
      border-bottom: none;
      box-shadow: 0 -8px 30px rgba(90,74,107,0.18);
      max-height: 70vh; overflow-y: auto;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      transition: none;
    }
    .sheet-handle {
      display: flex; align-items: center; justify-content: space-between;
      margin: -4px -16px 10px; padding: 6px 10px 10px;
      cursor: grab; touch-action: none;
    }
    .sheet-handle .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto; }
    .sheet-handle .side-slot { width: 28px; height: 28px; flex-shrink: 0; }
    #sheetHandle .pn-btn { position: static !important; width: 28px !important; height: 28px !important; }
    #sheetHandle .pn-btn img { width: 20px !important; height: 20px !important; }
    #sheetHandle #syncBadge { position: static !important; bottom: auto !important; left: auto !important; padding: 3px 8px; font-size: 0.55rem; }

    .history-card { display: none; }
    .panel.expanded .history-card { display: block; }
    .sheet-collapsed-hint { font-size: 0.68rem; color: var(--text-dim); cursor: pointer; }

    .action-row .icon-action .btn-label { display: none; }
    .icon-action { width: 44px; height: 44px; padding: 0; justify-content: center; border-radius: 50%; }
  }

  @media (max-width: 480px) {
    .app { padding: 12px 12px 12px; }
    .sub-label { width: 48px; font-size: 0.68rem; }
    .ch { padding: 5px 11px; font-size: 0.75rem; }
    .result-side { font-size: 1.15rem; }
    .result-x { font-size: 0.95rem; }
    .result-sub-value { font-size: 0.9rem; }
    .pick-btn { padding: 11px 36px; font-size: 0.95rem; }
    .pool-tab { font-size: 0.78rem; min-width: 74px; padding: 8px 4px; }
    .fbtn { padding: 4px 10px; font-size: 0.68rem; }
    .count-btn { width: 28px; height: 28px; }
  }
</style>
</head>
<body>

<!-- Sync indicator -->
<div class="sync-badge" id="syncBadge"><span class="dot"></span>실시간 연결됨</div>

<a class="nav-link nav-corner" href="./">← 홈</a>
<div class="nav-corner-right">
  <a class="action-pill" href="story/story-list.html"><span class="icon-inline" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><line x1="3" y1="4" x2="13" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="3" y1="8" x2="13" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="3" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></span>글 목록</a>
  <a class="action-pill" href="random-admin.html"><span class="icon-inline" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="4" r="1.6" fill="currentColor"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="8" r="1.6" fill="currentColor"/><line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="12" r="1.6" fill="currentColor"/></svg></span>뽑기 설정</a>
</div>

<div class="app">
  <header class="page-hero">
    <h1>랜덤 뽑기</h1>
  </header>

  <!-- Loading state -->
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <div>데이터 불러오는 중...</div>
  </div>

  <!-- Main content (hidden until loaded) -->
  <div id="mainContent" style="display: none;">
    <div class="layout">
      <div class="pool-col">
        <div class="pool-top-sticky">
          <div class="pool-tabs" id="poolTabs"></div>
          <div class="override-row" id="overrideBar" style="display:none"></div>
          <div class="filters-row">
            <div class="filters" id="filters">
              <button class="fbtn" data-filter="male" onclick="toggleFilter(this)">♂ 남성만</button>
              <button class="fbtn" data-filter="female" onclick="toggleFilter(this)">♀ 여성만</button>
              <button class="fbtn" data-filter="solo" onclick="toggleFilter(this)">솔로만</button>
              <button class="fbtn" data-filter="couple" onclick="toggleFilter(this)">커플만</button>
            </div>
            <div class="pool-counter" id="poolCounter"></div>
          </div>
        </div>

        <div id="poolSection"></div>
      </div>

      <aside class="panel" id="panel">
        <div class="sheet-handle" id="sheetHandle">
          <span class="side-slot"></span>
          <span class="bar"></span>
          <span class="side-slot"></span>
        </div>

        <div class="count-select">
          <span class="count-label">인원</span>
          <div class="count-btns" id="countBtns"></div>
        </div>
        <div class="pick-counts" id="counts"></div>
        <div id="resultArea"></div>

        <div class="action-row" id="resultActions" style="display:none">
          <button class="icon-action" id="copyResultBtn" onclick="copyCurrentResult()" title="결과 복사">
            <span class="icon-inline" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="3.5" y="2.8" width="9" height="11.5" rx="1.4" stroke="currentColor" stroke-width="1.4"/><rect x="6" y="1.3" width="4" height="2.2" rx="0.6" fill="currentColor"/></svg></span>
            <span class="btn-label">결과 복사</span>

            <span class="icon-inline" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2.8 2.8h8.6l1.8 1.8v8.6a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1V3.8a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><rect x="4.6" y="2.8" width="5" height="3.6" stroke="currentColor" stroke-width="1.4"/><rect x="4.6" y="9.3" width="6.8" height="4.9" stroke="currentColor" stroke-width="1.4"/></svg></span>
            <span class="btn-label">저장소에 저장</span>
          </button>
        </div>
        <div class="action-row" id="noResultBtnRow" style="display:none">
          <button class="pick-btn" id="pickBtnNoResult" onclick="doPick()" disabled="">뽑기!</button>
        </div>

        <button type="button" class="sheet-collapsed-hint" id="historyCountHint" onclick="setSheetExpanded(true)" style="display:none"></button>

        <div class="history-card" id="historyCard">
          <div class="history-header">
            <span class="history-title">최근 결과</span>
            <button class="history-clear" id="historyClearBtn" onclick="hist.length=0;renderHist()">초기화</button>
          </div>
          <div class="history" id="hist"></div>
        </div>

        <div class="list-btns">
          <button class="list-btn" onclick="showListModal('role')">
            <span class="icon-inline" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 2.5h5l6 6-5 5-6-6v-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="5.2" cy="5.2" r="1" fill="currentColor"/></svg></span>
            캐릭터 설정 전체 확인
          </button>
          <button class="list-btn" onclick="showListModal('au')">
            <span class="icon-inline" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="6" cy="8" r="4" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="8" r="4" stroke="currentColor" stroke-width="1.3"/></svg></span>
            관계성 전체 확인
          </button>
        </div>
      </aside>
    </div>
  </div>
</div>

<div class="modal-overlay" id="listModal" onclick="if(event.target===this)closeListModal()">
  <div class="modal">
    <button class="modal-exit" onclick="closeListModal()"><img src="assets/modal/exit.png" alt="닫기"></button>
    <img class="modal-ribbon" src="assets/modal/ribbon.png" alt="">
    <h3 id="listModalTitle">목록</h3>
    <ul class="modal-list" id="listModalBody"></ul>
    <button class="modal-close" onclick="closeListModal()">닫기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/personal-nav.js"></script>
<script src="assets/api.js"></script>
<script src="assets/storage-modal.js"></script>

<script>
// ============ ICONS ============
const ICON_CHECK = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.3 12L13 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_HEART = '<svg width="9" height="9" viewBox="0 0 16 16" fill="currentColor"><path d="M8 14C3 10.4 1 7.9 1 5.4 1 3.4 2.6 2 4.5 2c1.2 0 2.4.6 3.5 2 1.1-1.4 2.3-2 3.5-2C13.4 2 15 3.4 15 5.4c0 2.5-2 5-7 8.6z"/></svg>';
const ICON_TARGET = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="0.9" fill="currentColor"/></svg>';
const ICON_PIN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 14.5s5-4.6 5-8.3a5 5 0 1 0-10 0c0 3.7 5 8.3 5 8.3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="6.2" r="1.7" stroke="currentColor" stroke-width="1.4"/></svg>';
const ICON_REFRESH = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.5 2.5v3.4h-3.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ============ DEFAULT DATA (seed) ============
const DEFAULT_CHARS = {
  groups: [
    { owner: '김굥', subs: [
      { label: '02즈', items: [{n:'도아랑',g:1,c:0},{n:'백설호',g:0,c:0},{n:'진서화',g:1,c:0},{n:'진서희',g:0,c:0}] },
      { label: '가명즈', items: [{n:'윤신우',g:0,c:0},{n:'윤민우',g:1,c:0},{n:'연이안',g:0,c:0},{n:'도하랑',g:1,c:0},{n:'신지호',g:0,c:0}] },
      { label: '게임즈', items: [] }
    ]},
    { owner: '하지', subs: [
      { label: '응애', items: [{n:'채재이',g:0,c:1},{n:'서무연',g:1,c:1},{n:'함시연',g:1,c:0},{n:'혜이린',g:0,c:0}] },
      { label: '으른', items: [{n:'공준',g:0,c:0},{n:'백단',g:0,c:1},{n:'유세림',g:1,c:1},{n:'함시한',g:0,c:0},{n:'함시현',g:0,c:0}] },
    ]},
    { owner: '예밍', subs: [
      { label: '후배즈', items: [] },
      { label: '선배즈', items: [] },
      { label: '신왕즈', items: [] }
    ]}
  ]
};

const DEFAULT_ROLES = {
  groups: [{ label: '기본', items: ['기사','마법사','도적','궁수','성직자'] }]
};

const DEFAULT_AUS = {
  groups: [{ label: '기본', items: ['판타지 왕국','현대 카페','학원물','우주 SF'] }]
};

// ============ APP STATE ============
let CHARS = { groups: [] };
let ROLES = { groups: [] };
let AUS = { groups: [] };
let USER_NAMES = ['김굥', '하지', '예밍'];
let charMap = {};

const MAX_PARTICIPANTS = 5;

let participantCount = 2;
const commonSel = new Set();
let overrides = [null, null, null, null, null]; // Set|null per position (0-indexed)
let activeTab = 'common'; // 'common' or position index (number)
const filtersByTab = {}; // key -> Set

let spinning = false;
const hist = []; // { kind: 'draw'|'reroll', names[], roles[], rolesShared, au }
let currentNames = [], currentRoles = [], currentRolesShared = false, currentAU = null;
let hasResult = false;
let panelExpanded = false;

// ============ API LOAD ============
const POLL_INTERVAL_MS = 7000;

function toLegacyChars(tree) {
  return {
    groups: (tree.owners || []).map(o => ({
      owner: o.name,
      subs: (o.subgroups || []).map(sg => ({
        label: sg.label,
        items: (sg.characters || []).map(c => ({ n: c.name, g: c.gender, c: c.isCouple }))
      }))
    }))
  };
}

function normalizeTagTree(data) {
  return data && data.groups ? data : { groups: [{ label: '기본', items: (data && data.list) || [] }] };
}

async function initData() {
  try {
    const [tree, roleData, auData, users] = await Promise.all([
      API.getCharacters(),
      API.getRoles(),
      API.getAus(),
      API.getUsers()
    ]);

    if (Array.isArray(users) && users.length) {
      USER_NAMES = users.map(u => u.name);
    }

    CHARS = toLegacyChars(tree);
    ROLES = normalizeTagTree(roleData);
    AUS = normalizeTagTree(auData);

    buildCharMap();
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    setSyncStatus(true);
    renderAll();
    afterLayoutReady();

    startPolling();
  } catch (err) {
    console.error('데이터 로드 오류:', err);
    // Fallback to defaults
    CHARS = DEFAULT_CHARS;
    ROLES = DEFAULT_ROLES;
    AUS = DEFAULT_AUS;
    buildCharMap();
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    setSyncStatus(false);
    renderAll();
    afterLayoutReady();
    toast('오프라인 모드 (로컬 데이터)');
  }
}

function buildCharMap() {
  charMap = {};
  CHARS.groups.forEach(g => g.subs.forEach(s => s.items.forEach(it => {
    charMap[it.n] = { gender: it.g, couple: it.c };
  })));
}

function startPolling() {
  setInterval(async () => {
    try {
      const tree = await API.getCharacters();
      CHARS = toLegacyChars(tree);
      buildCharMap();
      renderPoolTabs();
      renderPoolSection();
      updCounts();
      setSyncStatus(true);
    } catch (err) { console.warn('Char poll error:', err); setSyncStatus(false); }
  }, POLL_INTERVAL_MS);

  setInterval(async () => {
    try {
      const rd = await API.getRoles();
      ROLES = normalizeTagTree(rd);
      setSyncStatus(true);
    } catch (err) { setSyncStatus(false); }
  }, POLL_INTERVAL_MS);

  setInterval(async () => {
    try {
      const ad = await API.getAus();
      AUS = normalizeTagTree(ad);
      setSyncStatus(true);
    } catch (err) { setSyncStatus(false); }
  }, POLL_INTERVAL_MS);
}

function setSyncStatus(online) {
  const badge = document.getElementById('syncBadge');
  if (online) {
    badge.classList.remove('offline');
    badge.innerHTML = '<span class="dot"></span>실시간 연결됨';
  } else {
    badge.classList.add('offline');
    badge.innerHTML = '<span class="dot"></span>오프라인';
  }
}

// ============ RENDER: OVERALL ============
function renderAll() {
  renderCountBtns();
  renderResultPlaceholder();
  renderPoolTabs();
  renderOverrideBar();
  renderPoolSection();
  renderHist();
  updCounts();
}

// ============ PARTICIPANT COUNT ============
function renderCountBtns() {
  const el = document.getElementById('countBtns');
  el.innerHTML = [1,2,3,4,5].map(n =>
    `<button class="count-btn${n===participantCount?' active':''}" onclick="setParticipantCount(${n})">${n}</button>`
  ).join('');
}

function setParticipantCount(n) {
  if (n === participantCount) return;
  participantCount = n;
  for (let i = n; i < MAX_PARTICIPANTS; i++) overrides[i] = null;
  if (activeTab !== 'common' && activeTab >= n) activeTab = 'common';
  renderCountBtns();
  renderResultPlaceholder();
  renderPoolTabs();
  renderOverrideBar();
  renderPoolSection();
  updCounts();
  updateSheetClearance();
}

// ============ FILTERS ============
function getFilters(key) {
  if (!filtersByTab[key]) filtersByTab[key] = new Set();
  return filtersByTab[key];
}

function activeFilterKey() { return activeTab === 'common' ? 'common' : activeTab; }

function syncFilterBtns() {
  const f = getFilters(activeFilterKey());
  document.querySelectorAll('.fbtn').forEach(b => b.classList.toggle('active', f.has(b.dataset.filter)));
}

function toggleFilter(btn) {
  const f = getFilters(activeFilterKey());
  const k = btn.dataset.filter;
  if(k==='male'&&f.has('female')) f.delete('female');
  if(k==='female'&&f.has('male')) f.delete('male');
  if(k==='solo'&&f.has('couple')) f.delete('couple');
  if(k==='couple'&&f.has('solo')) f.delete('solo');
  if(f.has(k)) f.delete(k); else f.add(k);
  syncFilterBtns(); applyFiltersToSection(); renderPoolCounter(); updateResultBadges();
}

function passesFilter(name, fs) {
  const c = charMap[name]; if(!c) return true;
  if(fs.has('male')&&c.gender!==0) return false;
  if(fs.has('female')&&c.gender!==1) return false;
  if(fs.has('solo')&&c.couple!==0) return false;
  if(fs.has('couple')&&c.couple!==1) return false;
  return true;
}

function applyFiltersToSection() {
  const f = getFilters(activeFilterKey());
  document.querySelectorAll('#poolSection .ch').forEach(b => {
    b.classList.toggle('filtered-out', f.size>0 && !passesFilter(b.dataset.name, f));
  });
}

// ============ POOL TABS ============
function renderPoolTabs() {
  const el = document.getElementById('poolTabs');
  let html = `<button class="pool-tab${activeTab==='common'?' active':''}" onclick="switchTab('common')"><span>${ICON_TARGET} 공통</span><span class="src">${commonSel.size}</span></button>`;
  for (let i=0;i<participantCount;i++) {
    const ov = overrides[i];
    const srcHtml = ov ? `<span class="src is-custom">직접 ${ov.size}</span>` : `<span class="src">공통</span>`;
    html += `<button class="pool-tab${activeTab===i?' active':''}" onclick="switchTab(${i})"><span>위치 ${i+1}</span>${srcHtml}</button>`;
  }
  el.innerHTML = html;
}

function switchTab(tab) {
  activeTab = tab;
  renderPoolTabs();
  renderOverrideBar();
  renderPoolSection();
}

// ============ OVERRIDE ROW (segmented switch + import) ============
async function renderOverrideBar() {
  const el = document.getElementById('overrideBar');
  if (activeTab === 'common') { el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'flex';
  const i = activeTab;
  const isOv = !!overrides[i];
  let sourcesHtml = `<option value="" selected disabled>가져오기</option><option value="common">공통 후보</option>`;
  for (let k=0;k<participantCount;k++) { if (k===i) continue; sourcesHtml += `<option value="${k}">위치${k+1}</option>`; }
  el.innerHTML = `
    <div class="seg-switch">
      <button type="button" class="seg-btn${isOv?'':' active'}" onclick="setOverrideMode(false)">공통 따르기</button>
      <button type="button" class="seg-btn${isOv?' active':''}" onclick="setOverrideMode(true)">직접 고르기</button>
    </div>
    <select class="import-select" id="importSelect" ${isOv?'':'disabled'} onchange="importIntoActive(this.value)">${sourcesHtml}</select>
  `;
}

async function setOverrideMode(custom) {
  const i = activeTab;
  if (custom) {
    if (!overrides[i]) overrides[i] = new Set(commonSel);
  } else {
    if (overrides[i]) {
      const ok = await customConfirm('직접 고른 후보를 버리고 공통을 따를까요?');
      if (!ok) return;
    }
    overrides[i] = null;
  }
  renderOverrideBar();
  renderPoolSection();
  renderPoolTabs();
  updCounts();
  updateResultBadges();
}

function importIntoActive(src) {
  if (!src) return;
  const srcSet = src === 'common' ? commonSel : (overrides[Number(src)] || commonSel);
  overrides[activeTab] = new Set(srcSet);
  renderPoolSection();
  renderPoolTabs();
  updCounts();
  renderOverrideBar();
  updateResultBadges();
  toast('선택을 복사했어요');
}

// ============ POOL SECTION (character grid) ============
function activeEditableSet() {
  if (activeTab === 'common') return commonSel;
  return overrides[activeTab] || null;
}

function renderPoolCounter() {
  const el = document.getElementById('poolCounter');
  if (!el) return;
  const f = getFilters(activeFilterKey());
  const names = CHARS.groups.flatMap(g=>g.subs.flatMap(s=>s.items)).map(it=>it.n);
  const total = f.size ? names.filter(n=>passesFilter(n,f)).length : names.length;
  const set = activeTab==='common' ? commonSel : (overrides[activeTab] || commonSel);
  const selected = names.filter(n => set.has(n) && (f.size===0 || passesFilter(n,f))).length;
  const editable = !!activeEditableSet();
  el.innerHTML = `<span>선택 <b>${selected}</b> / 전체 ${total}</span>` +
    (editable ? `<button class="cat-toggle" onclick="togAllPool()">전체 선택</button>` : '');
}

function renderPoolSection() {
  const container = document.getElementById('poolSection');
  let displaySet, editable;
  if (activeTab === 'common') {
    displaySet = commonSel; editable = true;
  } else {
    const ov = overrides[activeTab];
    if (ov) { displaySet = ov; editable = true; }
    else { displaySet = commonSel; editable = false; }
  }
  const f = getFilters(activeFilterKey());

  const gHtml = CHARS.groups.map(g => {
    const sHtml = g.subs.filter(s=>s.items.length).map(s => {
      const btns = s.items.map(it => {
        const name = it.n, gender = it.g, couple = it.c;
        const on = displaySet.has(name) ? ' on' : '';
        const gT = gender===0?'♂':'♀';
        const cT = couple===1?`<span class="heart">${ICON_HEART}</span>`:'';
        const cls = 'ch' + on + (editable ? '' : ' ch-readonly');
        const click = editable ? ` onclick="togPool(this,'${esc(name)}')"` : '';
        return `<button class="${cls}" data-name="${esc(name)}"${click}><span class="chk">${ICON_CHECK}</span>${esc(name)}<span class="tag">${gT}${cT}</span></button>`;
      }).join('');
      return `<div class="sub-row"><div class="sub-label">${esc(s.label)}</div><div class="sub-items">${btns}</div></div>`;
    }).join('');

    const members = g.subs.flatMap(s=>s.items).map(it=>it.n);
    const visibleMembers = f.size ? members.filter(n=>passesFilter(n,f)) : members;
    const selectedCount = visibleMembers.filter(n=>displaySet.has(n)).length;
    const allOn = visibleMembers.length>0 && visibleMembers.every(n=>displaySet.has(n));

    if(!sHtml) return `<div class="owner-block"><div class="owner-header"><span class="owner-name">${esc(g.owner)}</span></div><div class="empty">항목 없음</div></div>`;

    const toggleBtn = editable ? `<button class="owner-toggle" onclick="togOwnerPool('${esc(g.owner)}')">${allOn?'전체 해제':'전체 선택'}</button>` : '';
    return `<div class="owner-block">
      <div class="owner-header">
        <span class="owner-name">${esc(g.owner)}</span>
        <span class="owner-count">${members.length}명 · ${selectedCount} 선택</span>
        ${toggleBtn}
      </div>${sHtml}</div>`;
  }).join('');

  const title = activeTab === 'common' ? '공통 후보' : `위치 ${activeTab+1} 후보`;
  const icon = activeTab === 'common' ? ICON_TARGET : ICON_PIN;

  container.innerHTML = `<div class="category">
    <div class="cat-header">
      <div class="cat-icon">${icon}</div>
      <div class="cat-title">${title}</div>
    </div>${gHtml}</div>`;

  syncFilterBtns();
  applyFiltersToSection();
  renderPoolCounter();
}

function togPool(btn, name) {
  const set = activeEditableSet();
  if (!set) return;
  if (set.has(name)) { set.delete(name); }
  else { set.add(name); }
  renderPoolSection();
  updCounts();
  renderPoolTabs();
  updateResultBadges();
}

function getVisibleNamesForActive(owner) {
  const f = getFilters(activeFilterKey());
  let groups = CHARS.groups;
  if (owner) groups = groups.filter(g=>g.owner===owner);
  return groups.flatMap(g=>g.subs.flatMap(s=>s.items)).map(it=>it.n).filter(n=>passesFilter(n,f));
}

function togOwnerPool(owner) {
  const set = activeEditableSet();
  if (!set) return;
  const names = getVisibleNamesForActive(owner);
  if (!names.length) return;
  const allOn = names.every(n=>set.has(n));
  names.forEach(n=>{ if(allOn) set.delete(n); else set.add(n); });
  renderPoolSection(); updCounts(); renderPoolTabs(); updateResultBadges();
  toast(allOn?`${owner} 전체 해제`:`${owner} 전체 선택`);
}

function togAllPool() {
  const set = activeEditableSet();
  if (!set) return;
  const names = getVisibleNamesForActive();
  if (!names.length) return;
  const allOn = names.every(n=>set.has(n));
  names.forEach(n=>{ if(allOn) set.delete(n); else set.add(n); });
  renderPoolSection(); updCounts(); renderPoolTabs(); updateResultBadges();
  toast(allOn?'전체 해제':'전체 선택');
}

// ============ COUNTS ============
function effectivePool(i) {
  return overrides[i] ? [...overrides[i]] : [...commonSel];
}

function canPick() {
  for (let i=0;i<participantCount;i++) if (effectivePool(i).length===0) return false;
  return true;
}

function updCounts() {
  const parts = [`공통 <b style="color:var(--violet)">${commonSel.size}</b>개`];
  for (let i=0;i<participantCount;i++) {
    if (overrides[i]) parts.push(`위치${i+1} <b style="color:var(--violet)">${overrides[i].size}</b>개(커스텀)`);
  }
  document.getElementById('counts').innerHTML = parts.join(' · ');
  const disabled = !canPick();
  document.getElementById('pickBtn').disabled = disabled;
  const noResultBtn = document.getElementById('pickBtnNoResult');
  if (noResultBtn) noResultBtn.disabled = disabled;
  renderPoolCounter();
}

// ============ RESULT DISPLAY ============
function nameGradStyle() {
  return `background:linear-gradient(135deg, var(--violet), #7c5cbf); -webkit-background-clip:text; -webkit-text-fill-color:transparent;`;
}

function filteredPoolCount(i) {
  const pool = effectivePool(i);
  const f = getFilters(i);
  return f.size ? pool.filter(n=>passesFilter(n,f)).length : pool.length;
}

function resultBadgeHtml(i) {
  const isCustom = !!overrides[i];
  const n = filteredPoolCount(i);
  return `<span class="result-badge${isCustom?' is-custom':''}" id="resultBadge${i}">${isCustom?'직접':'공통'} ${n}</span>`;
}

// Pool composition (selection/filters/override) can change after the result
// skeleton is already on screen — keep each slot's badge live rather than
// frozen at whatever it read when renderResultPlaceholder() last ran.
function updateResultBadges() {
  for (let i=0;i<participantCount;i++) {
    const el = document.getElementById('resultBadge'+i);
    if (!el) continue;
    const isCustom = !!overrides[i];
    el.className = 'result-badge' + (isCustom?' is-custom':'');
    el.textContent = `${isCustom?'직접':'공통'} ${filteredPoolCount(i)}`;
  }
}

function updateMainBtnLabel() {
  const label = hasResult ? '다시 뽑기' : '뽑기!';
  const b1 = document.getElementById('pickBtn');
  const b2 = document.getElementById('pickBtnNoResult');
  if (b1) b1.textContent = label;
  if (b2) b2.textContent = label;
}

function renderResultPlaceholder() {
  const el = document.getElementById('resultArea');
  const nameSpans = Array.from({length:participantCount}, (_,i) => `<div class="result-slot"><span class="result-side"><span class="ph">???</span></span>${resultBadgeHtml(i)}</div>`).join(`<span class="result-x">✕</span>`);
  const roleSpans = Array.from({length:participantCount}, () => `<span class="result-sub-value"><span class="ph">—</span></span>`).join(`<span class="result-role-sep">✕</span>`);
  el.innerHTML = `
    <div class="result-coupling">${nameSpans}</div>
    <div class="result-subs">
      <div class="result-sub-row">
        <span class="result-sub-label">캐릭터 설정</span>
        <span class="result-role-group" id="roleGroup">${roleSpans}</span>
      </div>
      <div class="result-sub-row">
        <span class="result-sub-label">관계성</span>
        <span class="result-sub-value" id="resAU"><span class="ph">—</span></span>
      </div>
    </div>
    <div class="reroll-row">
      <button class="reroll-btn" id="rerollRole" onclick="rerollRole()" disabled="">${ICON_REFRESH} 설정 리롤</button>
      <button class="reroll-btn" id="rerollAU" onclick="rerollAU()" disabled="">${ICON_REFRESH} 관계성 리롤</button>
    </div>`;
  hasResult = false;
  document.getElementById('resultActions').style.display = 'none';
  document.getElementById('noResultBtnRow').style.display = 'flex';
  updateMainBtnLabel();

// ============ PICK ============
function randFrom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function allRoles() { return ROLES.groups.flatMap(g => g.items); }
function allAUs() { return AUS.groups.flatMap(g => g.items); }

function randTagFrom(data) {
  const gs = data.groups.filter(g => g.items.length > 0);
  return gs.length ? randFrom(gs) : null;
}

function pickRolesForN(n) {
  const g = randTagFrom(ROLES);
  if (!g) return { roles: Array(n).fill('?'), shared: false };
  if (g.label === '세계관') {
    const role = randFrom(g.items);
    return { roles: Array(n).fill(role), shared: true };
  }
  const pool = [...g.items];
  if (pool.length >= n) {
    const shuffled = [...pool].sort(()=>Math.random()-0.5);
    return { roles: shuffled.slice(0, n), shared: false };
  }
  return { roles: Array.from({length:n}, ()=>randFrom(pool)), shared: false };
}

function renderFinalRoles(rolesResult) {
  const el = document.getElementById('roleGroup');
  if (rolesResult.shared) {
    el.innerHTML = `<span class="result-role-text result-pop">${esc(rolesResult.roles[0])}</span>`;
  } else {
    el.innerHTML = rolesResult.roles.map((r,i)=>`<span class="result-role-text result-pop" style="animation-delay:${(i*0.05).toFixed(2)}s">${esc(r)}</span>`).join('<span class="result-role-sep">✕</span>');
  }
}

function formatResult(names, roles, rolesShared, au) {
  if (rolesShared) {
    return `${names.join(' ✕ ')} (${roles[0]}) / ${au}`;
  }
  return names.map((n,i)=>`${n}(${roles[i]})`).join(' ✕ ') + ` / ${au}`;
}

function resultEntryText() {
  return formatResult(currentNames, currentRoles, currentRolesShared, currentAU);
}

function pushHistory(kind) {
  hist.unshift({ kind, names: [...currentNames], roles: [...currentRoles], rolesShared: currentRolesShared, au: currentAU });
  if (hist.length>20) hist.pop();
  renderHist();
}

function pickAUFromTag() {
  const g = randTagFrom(AUS);
  return g ? randFrom(g.items) : '?';
}

function drawAssignment(pools) {
  const n = pools.length;
  const order = pools.map((p,i)=>i).sort((a,b)=>pools[a].length-pools[b].length);
  const result = new Array(n);
  const used = new Set();
  function bt(idx) {
    if (idx >= n) return true;
    const posi = order[idx];
    const candidates = pools[posi].filter(x=>!used.has(x));
    for (let i=candidates.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
    for (const cand of candidates) {
      result[posi]=cand; used.add(cand);
      if (bt(idx+1)) return true;
      used.delete(cand);
    }
    return false;
  }
  if (bt(0)) return { names: result, duplicated: false };
  return { names: pools.map(p=>randFrom(p)), duplicated: true };
}

function doPick() {
  if (!canPick() || spinning) return;
  spinning = true;
  const btn = document.getElementById('pickBtn');
  const btn2 = document.getElementById('pickBtnNoResult');
  btn.disabled = true;
  if (btn2) btn2.disabled = true;
  document.getElementById('rerollRole').disabled = true;
  document.getElementById('rerollAU').disabled = true;

  const nameEls = document.querySelectorAll('#resultArea .result-coupling .result-side');
  document.getElementById('roleGroup').innerHTML = Array.from({length:participantCount}, () => `<span class="result-sub-value"><span class="ph">—</span></span>`).join('<span class="result-role-sep">✕</span>');
  const roleEls = document.querySelectorAll('#resultArea #roleGroup .result-sub-value');
  const auEl = document.getElementById('resAU');
  const pools = Array.from({length:participantCount}, (_,i)=>effectivePool(i));

  let count = 0;
  const total = 16 + Math.floor(Math.random()*10);

  const iv = setInterval(()=>{
    nameEls.forEach((el,i)=>{ el.innerHTML = `<span style="color:var(--text-dim)">${esc(randFrom(pools[i]))}</span>`; });
    roleEls.forEach(el=>{ el.innerHTML = `<span style="color:var(--text-dim)">${esc(randFrom(allRoles()))}</span>`; });
    auEl.innerHTML = `<span style="color:var(--text-dim)">${esc(randFrom(allAUs()))}</span>`;
    count++;
    if (count>=total) {
      clearInterval(iv);
      const draw = drawAssignment(pools);
      currentNames = draw.names;
      const rolesResult = pickRolesForN(participantCount);
      currentRoles = rolesResult.roles;
      currentRolesShared = rolesResult.shared;
      currentAU = pickAUFromTag();
      hasResult = true;
      document.getElementById('resultActions').style.display = 'flex';
      document.getElementById('noResultBtnRow').style.display = 'none';
      updateMainBtnLabel();

      nameEls.forEach((el,i)=>{
        el.innerHTML = `<span class="result-pop" style="animation-delay:${(i*0.05).toFixed(2)}s;${nameGradStyle()}">${esc(currentNames[i])}</span>`;
      });
      renderFinalRoles(rolesResult);
      auEl.innerHTML = `<span class="result-au-text result-pop">${esc(currentAU)}</span>`;

      pushHistory('draw');
      updateSheetClearance();
      particles(document.getElementById('pickBtn'));
      spinning = false;
      btn.disabled = false;
      if (btn2) btn2.disabled = false;
      document.getElementById('rerollRole').disabled = false;
      document.getElementById('rerollAU').disabled = false;
      if (draw.duplicated) toast('후보가 부족해서 일부 캐릭터가 중복됐어요');
    }
  }, 55+count*4);
}

function rerollRole() {
  if (!hasResult || spinning) return;
  document.getElementById('roleGroup').innerHTML = Array.from({length:participantCount}, () => `<span class="result-sub-value"></span>`).join('<span class="result-role-sep">✕</span>');
  const roleEls = document.querySelectorAll('#resultArea #roleGroup .result-sub-value');
  let c = 0;
  const total = 8 + Math.floor(Math.random()*5);
  const iv = setInterval(()=>{
    roleEls.forEach(el=>{ el.innerHTML = `<span style="color:var(--text-dim)">${esc(randFrom(allRoles()))}</span>`; });
    c++;
    if (c>=total) {
      clearInterval(iv);
      const rolesResult = pickRolesForN(participantCount);
      currentRoles = rolesResult.roles;
      currentRolesShared = rolesResult.shared;
      renderFinalRoles(rolesResult);
      pushHistory('reroll');
    }
  }, 50);
}

function rerollAU() {
  if (!hasResult || spinning) return;
  const el = document.getElementById('resAU');
  let c = 0;
  const total = 8 + Math.floor(Math.random()*5);
  const iv = setInterval(()=>{
    el.innerHTML = `<span style="color:var(--text-dim)">${esc(randFrom(allAUs()))}</span>`;
    c++;
    if (c>=total) {
      clearInterval(iv);
      currentAU = pickAUFromTag();
      el.innerHTML = `<span class="result-au-text result-pop">${esc(currentAU)}</span>`;
      pushHistory('reroll');
    }
  }, 50);
}

function renderHist() {
  const el = document.getElementById('hist');
  el.innerHTML = hist.map(e=>{
    const text = formatResult(e.names, e.roles, e.rolesShared, e.au);
    const badge = e.kind==='reroll' ? '<span class="reroll-badge">리롤</span>' : '';
    return `<span class="history-chip" onclick="copyText('${esc(text).replace(/'/g,"\\&#39;")}')">${badge}${esc(text)}</span>`;
  }).join('');
  updateHistoryHint();
}

function updateHistoryHint() {
  const hint = document.getElementById('historyCountHint');
  if (!hint) return;
  hint.textContent = hist.length ? `최근 ${hist.length} ▸` : '';
  hint.style.display = (isMobileLayout() && !panelExpanded && hist.length > 0) ? 'block' : 'none';
}

function copyText(text) {
  const clean = text.replace(/&#39;/g, "'").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
  navigator.clipboard.writeText(clean).then(()=>{
    toast('복사되었습니다');
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = clean; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('복사되었습니다');
  });
}

function copyCurrentResult() {
  if (!hasResult) return;
  const text = resultEntryText();
  navigator.clipboard.writeText(text).then(()=>toast('복사되었습니다')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    toast('복사되었습니다');
  });
}

async function saveCurrentResult() {
  if (!hasResult) return;
  const result = await openStoragePicker({
    title: '저장소에 저장',
    users: USER_NAMES,
    targets: null
  });
  if (!result) return;
  try {
    await API.addDrawBox(result.user, {
      names: currentNames, roles: currentRoles,
      au: currentAU, memo: ''
    });
    toast(`${result.user}님의 뽑기 보관함에 저장했어요`);
  } catch (e) {
    console.error('저장 실패:', e);
    toast('저장에 실패했어요');
  }
}

// ============ LIST MODAL ============
function showListModal(type) {
  const overlay = document.getElementById('listModal');
  const title = document.getElementById('listModalTitle');
  const body = document.getElementById('listModalBody');
  title.innerHTML = type==='role'
    ? `<span class="icon-inline" aria-hidden="true" style="vertical-align:-2px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2.5 2.5h5l6 6-5 5-6-6v-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="5.2" cy="5.2" r="1" fill="currentColor"/></svg></span> 캐릭터 설정 목록`
    : `<span class="icon-inline" aria-hidden="true" style="vertical-align:-2px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="6" cy="8" r="4" stroke="currentColor" stroke-width="1.3"/><circle cx="10" cy="8" r="4" stroke="currentColor" stroke-width="1.3"/></svg></span> 관계성 목록`;

  const groups = (type==='role' ? ROLES : AUS).groups;
  let html = '';
  for (const g of groups) {
    if (!g.items.length) continue;
    const sorted = [...g.items].sort((a, b) => a.localeCompare(b, 'ko'));
    html += `<li class="group-label">${esc(g.label)}</li>`;
    sorted.forEach((item, i) => {
      html += `<li><span class="idx">${i+1}</span>${esc(item)}</li>`;
    });
  }
  body.innerHTML = html;
  overlay.classList.add('open');
}

function closeListModal() {
  document.getElementById('listModal').classList.remove('open');
}

// ============ EFFECTS ============
function particles(target) {
  const r = target.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols = ['#f472b6','#60a5fa','#a78bfa','#34d399','#fbbf24','#fb7185'];
  for(let i=0;i<12;i++){
    const el=document.createElement('div');el.className='ptcl';
    const a=(Math.PI*2*i)/12, d=35+Math.random()*55;
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.setProperty('--dx',Math.cos(a)*d+'px');
    el.style.setProperty('--dy',Math.sin(a)*d+'px');
    el.style.background=cols[i%cols.length];
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),700);
  }
}

function toast(m) {
  const t=document.getElementById('toast');
  t.textContent=m;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function esc(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

// ============ MOBILE BOTTOM SHEET ============
function isMobileLayout() { return window.innerWidth < 960; }

function setSheetExpanded(expanded) {
  panelExpanded = expanded;
  document.getElementById('panel').classList.toggle('expanded', expanded);
  updateHistoryHint();
}

function updateSheetClearance() {
  const pool = document.getElementById('poolSection');
  const panel = document.getElementById('panel');
  if (!pool || !panel) return;
  if (isMobileLayout()) {
    pool.style.paddingBottom = (panel.offsetHeight + 24) + 'px';
  } else {
    pool.style.paddingBottom = '';
  }
}

function relocateWidgets() {
  const pnBtn = document.querySelector('.pn-btn');
  const pnPopup = document.querySelector('.pn-popup');
  const syncBadge = document.getElementById('syncBadge');
  const handle = document.getElementById('sheetHandle');
  if (!handle) return;
  const slots = handle.querySelectorAll('.side-slot');
  if (isMobileLayout()) {
    if (pnBtn && slots[1] && pnBtn.parentElement !== slots[1]) slots[1].appendChild(pnBtn);
    if (syncBadge && slots[0] && syncBadge.parentElement !== slots[0]) slots[0].appendChild(syncBadge);
  } else {
    if (pnBtn && pnBtn.parentElement !== document.body) document.body.appendChild(pnBtn);
    if (syncBadge && syncBadge.parentElement !== document.body) document.body.appendChild(syncBadge);
    if (pnPopup && pnPopup.parentElement !== document.body) document.body.appendChild(pnPopup);
  }
}

function afterLayoutReady() {
  relocateWidgets();
  updateSheetClearance();
  updateHistoryHint();
}

window.addEventListener('resize', () => {
  relocateWidgets();
  updateSheetClearance();
  updateHistoryHint();
});

(function setupSheetDrag() {
  const handle = document.getElementById('sheetHandle');
  if (!handle) return;
  let startY = null;

  function onDown(e) {
    if (!isMobileLayout()) return;
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
  }
  function onMove(e) {
    if (startY == null || !isMobileLayout()) return;
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = y - startY;
    if (dy < -30) { setSheetExpanded(true); startY = null; }
    else if (dy > 30) { setSheetExpanded(false); startY = null; }
  }
  function onUp() { startY = null; }

  handle.addEventListener('click', (e) => {
    if (!isMobileLayout()) return;
    setSheetExpanded(!panelExpanded);
  });
  handle.addEventListener('touchstart', onDown, { passive: true });
  handle.addEventListener('touchmove', onMove, { passive: true });
  handle.addEventListener('touchend', onUp);
  handle.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  document.addEventListener('click', (e) => {
    if (!isMobileLayout() || !panelExpanded) return;
    const panel = document.getElementById('panel');
    if (panel && !panel.contains(e.target)) setSheetExpanded(false);
  });
})();

// ============ START ============
initData();
</script>
