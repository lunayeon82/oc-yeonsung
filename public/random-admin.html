<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 뽑기 설정</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#a89ec4">
<link rel="apple-touch-icon" href="/assets/icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="/assets/pwa.js" defer></script>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/modal.css">
<style>
  @font-face {
    font-family: 'ko-font';
    src: url('assets/ko-font.ttf') format('truetype');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--page-gradient); background-attachment: fixed; color: var(--text); min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 16px 20px; }

  /* Loading */
  .loading { text-align: center; padding: 60px 0; color: var(--text-dim); }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 2.5px solid var(--border); border-top-color: var(--violet); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tabs */
  .admin-tabs {
    display: flex; gap: 0; background: var(--surface); border-radius: var(--radius);
    border: 1px solid var(--border); overflow: hidden; margin: 20px 0 24px;
  }
  .admin-tab {
    flex: 1; padding: 12px 0; text-align: center;
    font-family: var(--font-title); font-weight: 700; font-size: 0.85rem;
    cursor: pointer; border: none; background: none; color: var(--text-dim);
    transition: all 0.2s; position: relative;
  }
  .admin-tab + .admin-tab { border-left: 1px solid var(--border); }
  .admin-tab::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; border-radius: 2px; background: transparent; transition: background 0.2s; }
  .admin-tab.active { color: var(--violet); }
  .admin-tab.active::after { background: var(--violet); }

  .tab-panel { display: none; }
  .tab-panel.visible { display: block; }

  /* Section card */
  .card {
    background: var(--surface-glass); backdrop-filter: blur(8px); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
  }
  .card-title { font-family: var(--font-title); font-weight: 700; font-size: 1rem; }
  .card-count { font-size: 0.7rem; color: var(--text-dim); }

  /* Add row */
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .add-input {
    flex: 1; min-width: 120px; padding: 8px 12px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 0.85rem; font-family: var(--font-body); outline: none;
  }
  .add-input:focus { border-color: var(--violet); }
  .add-input::placeholder { color: var(--text-muted); }

  .select-input {
    padding: 8px 12px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg);
    color: var(--text); font-size: 0.85rem; font-family: var(--font-body); outline: none;
    cursor: pointer;
  }
  .select-input:focus { border-color: var(--violet); }

  .add-btn {
    padding: 8px 16px; border: none; border-radius: 10px;
    background: var(--violet); color: #fff; font-weight: 700;
    cursor: pointer; font-family: var(--font-body); font-size: 0.85rem;
    transition: all 0.2s; white-space: nowrap;
  }
  .add-btn:hover { background: var(--violet); filter: brightness(1.15); }

  .danger-btn {
    padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 10px;
    background: none; color: var(--rose); font-weight: 600;
    cursor: pointer; font-family: var(--font-body); font-size: 0.8rem;
    transition: all 0.2s; white-space: nowrap;
  }
  .danger-btn:hover { border-color: var(--rose); background: rgba(251,113,133,0.1); }

  /* Item list */
  .item-list { display: flex; flex-direction: column; gap: 6px; }

  .item-del {
    width: 24px; height: 24px; border-radius: 50%; border: none;
    background: transparent; color: var(--text-muted); font-size: 0.75rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .item-del:hover { background: rgba(251,113,133,0.15); color: var(--rose); }

  .item-edit {
    padding: 3px 10px; border-radius: 100px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-size: 0.6rem; font-weight: 600;
    cursor: pointer; font-family: var(--font-body); transition: all 0.15s;
    white-space: nowrap;
  }
  .item-edit:hover { border-color: var(--violet); color: var(--violet); }

  /* Owner headers (roles/aus vocab groups) */
  .owner-section { margin-bottom: 20px; }
  .owner-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px;
  }
  .owner-title { font-family: var(--font-title); font-weight: 800; font-size: 1.05rem; }

  /* Simple list (roles, aus) */
  .simple-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-radius: 10px;
    background: var(--surface2); transition: background 0.15s;
  }
  .simple-item:hover { background: var(--surface3); }
  .simple-item .idx { color: var(--text-muted); font-size: 0.7rem; min-width: 20px; }
  .simple-item .name { flex: 1; font-size: 0.85rem; }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); padding: 8px 18px; border-radius: 100px;
    font-size: 0.8rem; z-index: 300;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Save indicator */
  .saving-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .saving-overlay.show { opacity: 1; pointer-events: all; }
  .saving-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 32px; text-align: center; }
  .saving-box .spinner { border-top-color: var(--amber); }

  @media (max-width: 480px) {
    .app { padding: 12px 12px 12px; }
    .admin-tab { font-size: 0.78rem; padding: 10px 0; }
    .add-row { flex-direction: column; }
    .add-input, .select-input { width: 100%; }
  }
</style>
</head>
<body>

<div class="sync-badge" id="syncBadge"><span class="dot"></span>실시간 연결됨</div>

<a class="nav-link nav-corner" href="./">← 홈</a>
<div class="nav-corner-right">
  <a class="action-pill" href="random.html">🎲 랜덤 뽑기</a>
</div>

<div class="app">
  <header class="page-hero">
    <h1>뽑기 설정</h1>
  </header>

  <div class="loading" id="loadingState" style="display: none;">
    <div class="spinner"></div>
    <div>데이터 불러오는 중...</div>
  </div>

  <div id="mainContent" style="display: block;">
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchTab('roles')">⚔️ 캐릭터 설정</button>
      <button class="admin-tab" onclick="switchTab('aus')">🌀 관계성</button>
    </div>

    <!-- ===== 캐릭터 설정 Panel ===== -->
    <div class="tab-panel visible" id="panel-roles">
      <div class="card">
        <div class="card-header"><span class="card-title">태그 추가</span></div>
        <div class="add-row">
          <input class="add-input" id="newRoleTagName" placeholder="태그 이름 (예: 판타지)">
          <button class="add-btn" onclick="addRoleTag()">태그 추가</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">캐릭터 설정 추가</span></div>
        <div class="add-row">
          <select class="select-input" id="roleTagSelect"></select>
          <input class="add-input" id="newRoleName" placeholder="이름 (예: 기사)" onkeydown="if(event.key==='Enter')addRole()">
          <button class="add-btn" onclick="addRole()">추가</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">캐릭터 설정 목록</span>
          <span class="card-count" id="roleCount">0개</span>
        </div>
        <div id="roleList"></div>
      </div>
    </div>

    <!-- ===== AUs Panel ===== -->
    <div class="tab-panel" id="panel-aus">
      <div class="card">
        <div class="card-header"><span class="card-title">태그 추가</span></div>
        <div class="add-row">
          <input class="add-input" id="newAUTagName" placeholder="태그 이름 (예: 로맨스)">
          <button class="add-btn" onclick="addAUTag()">태그 추가</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">관계성 추가</span></div>
        <div class="add-row">
          <select class="select-input" id="auTagSelect"></select>
          <input class="add-input" id="newAUName" placeholder="이름 (예: 판타지 왕국)" onkeydown="if(event.key==='Enter')addAU()">
          <button class="add-btn" onclick="addAU()">추가</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">관계성 목록</span>
          <span class="card-count" id="auCount">0개</span>
        </div>
        <div id="auList"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="renameModal" onclick="if(event.target===this)closeRenameModal()">
  <div class="modal">
    <button class="modal-exit" onclick="closeRenameModal()"><img src="assets/modal/exit.png" alt="닫기"></button>
    <img class="modal-ribbon" src="assets/modal/ribbon.png" alt="">
    <h3 id="renameModalTitle">수정</h3>
    <div class="modal-field">
      <label class="modal-label">이름</label>
      <input class="modal-input" id="renameInput" onkeydown="if(event.key==='Enter')saveRename()">
    </div>
    <div class="modal-field" id="renameTagField" style="display:none">
      <label class="modal-label">태그</label>
      <select class="modal-select" id="renameTagSelect"></select>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeRenameModal()">취소</button>
      <button class="modal-save" onclick="saveRename()">저장</button>
    </div>
  </div>
</div>

<div class="saving-overlay" id="savingOverlay">
  <div class="saving-box"><div class="spinner"></div><div>저장 중...</div></div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/personal-nav.js"></script>
<script src="assets/api.js"></script>
<script src="assets/confirm-modal.js"></script>

<script>
const POLL_INTERVAL_MS = 7000;

let ROLES = { groups: [] };
let AUS = { groups: [] };

function normalizeTagTree(data) {
  return data && data.groups ? data : { groups: [{ label: '기본', items: (data && data.list) || [] }] };
}

// ============ INIT ============
async function init() {
  try {
    const [roleData, auData] = await Promise.all([
      API.getRoles(),
      API.getAus()
    ]);
    ROLES = normalizeTagTree(roleData);
    AUS = normalizeTagTree(auData);

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('mainContent').style.display = 'block';
    setSyncStatus(true);
    renderAll();
    startPolling();
  } catch (err) {
    console.error(err);
    document.getElementById('loadingState').innerHTML = '<div style="color:var(--rose)">연결 실패. 새로고침 해주세요.</div>';
    setSyncStatus(false);
  }
}

function startPolling() {
  setInterval(async () => {
    try {
      ROLES = normalizeTagTree(await API.getRoles());
      renderRoles();
      setSyncStatus(true);
    } catch (err) { setSyncStatus(false); }
  }, POLL_INTERVAL_MS);

  setInterval(async () => {
    try {
      AUS = normalizeTagTree(await API.getAus());
      renderAUs();
      setSyncStatus(true);
    } catch (err) { setSyncStatus(false); }
  }, POLL_INTERVAL_MS);
}

function setSyncStatus(on) {
  const b = document.getElementById('syncBadge');
  b.className = 'sync-badge' + (on ? '' : ' offline');
  b.innerHTML = `<span class="dot"></span>${on ? '실시간 연결됨' : '오프라인'}`;
}

// ============ SAVE HELPERS ============
async function saveRoles() {
  showSaving();
  try {
    ROLES = await API.saveRoles(ROLES);
    renderRoles();
    toast('캐릭터 설정 저장 완료');
  } catch (e) { console.error(e); toast('저장 실패!'); }
  hideSaving();
}

async function saveAUs() {
  showSaving();
  try {
    AUS = await API.saveAus(AUS);
    renderAUs();
    toast('관계성 저장 완료');
  } catch (e) { console.error(e); toast('저장 실패!'); }
  hideSaving();
}

function showSaving() { document.getElementById('savingOverlay').classList.add('show'); }
function hideSaving() { document.getElementById('savingOverlay').classList.remove('show'); }

// ============ TABS ============
function switchTab(id) {
  document.querySelectorAll('.admin-tab').forEach((t,i) => {
    const panels = ['roles','aus'];
    const isActive = panels[i] === id;
    t.classList.toggle('active', isActive);
    document.getElementById('panel-'+panels[i]).classList.toggle('visible', isActive);
  });
}

// ============ RENDER ALL ============
function renderAll() {
  renderRoles();
  renderAUs();
}

// ============ ROLES ============
function renderRoles() {
  const total = ROLES.groups.reduce((s, g) => s + g.items.length, 0);
  document.getElementById('roleCount').textContent = total + '개';
  const container = document.getElementById('roleList');
  if (!ROLES.groups.length) {
    container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px 0">태그가 없습니다. 태그를 먼저 추가해주세요.</div>';
    updateRoleTagSelect(); return;
  }
  container.innerHTML = ROLES.groups.map((g, gi) => {
    const itemsHtml = g.items.map((item, ii) => `
      <div class="simple-item">
        <span class="idx">${ii+1}</span>
        <span class="name">${esc(item)}</span>
        <button class="item-edit" onclick="openRenameModal('role',${gi},${ii})">변경</button>
        <button class="item-del" onclick="delRole(${gi},${ii})" title="삭제">✕</button>
      </div>`).join('') || '<div style="color:var(--text-muted);font-size:0.8rem;padding:4px 0">비어있음</div>';
    return `<div class="owner-section">
      <div class="owner-header">
        <span class="owner-title">${esc(g.label)}</span>
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:4px">${g.items.length}개</span>
        <button class="item-edit" style="margin-left:auto" onclick="openRenameModal('roleTag',${gi})">태그 변경</button>
        <button class="danger-btn" style="font-size:0.65rem;padding:3px 10px" onclick="delRoleTag(${gi})">태그 삭제</button>
      </div>
      <div class="item-list">${itemsHtml}</div>
    </div>`;
  }).join('');
  updateRoleTagSelect();
}

function updateRoleTagSelect() {
  document.getElementById('roleTagSelect').innerHTML = ROLES.groups.map(g => `<option value="${esc(g.label)}">${esc(g.label)}</option>`).join('');
}

function addRoleTag() {
  const input = document.getElementById('newRoleTagName');
  const label = input.value.trim();
  if (!label) return;
  if (ROLES.groups.some(g => g.label === label)) { toast('이미 존재하는 태그'); return; }
  ROLES.groups.push({ label, items: [] });
  input.value = '';
  saveRoles();
}

async function delRoleTag(gi) {
  if (!(await customConfirm(`"${ROLES.groups[gi].label}" 태그와 하위 항목을 모두 삭제할까요?`))) return;
  ROLES.groups.splice(gi, 1);
  saveRoles();
}

function addRole() {
  const tagLabel = document.getElementById('roleTagSelect').value;
  const input = document.getElementById('newRoleName');
  const name = input.value.trim();
  if (!name) return;
  if (!tagLabel) { toast('태그를 먼저 추가해주세요'); return; }
  const g = ROLES.groups.find(g => g.label === tagLabel);
  if (!g) return;
  if (g.items.includes(name)) { toast('이미 존재하는 항목'); return; }
  g.items.push(name);
  input.value = '';
  saveRoles();
}

let renameTarget = null;

function openRenameModal(type, gi, ii) {
  let current = '';
  if (type === 'role') current = ROLES.groups[gi].items[ii];
  else if (type === 'au') current = AUS.groups[gi].items[ii];
  else if (type === 'roleTag') current = ROLES.groups[gi].label;
  else if (type === 'auTag') current = AUS.groups[gi].label;

  renameTarget = { type, gi, ii };
  const titles = { role: '캐릭터 설정 수정', au: '관계성 수정', roleTag: '태그 이름 수정', auTag: '태그 이름 수정' };
  document.getElementById('renameModalTitle').textContent = titles[type];
  document.getElementById('renameInput').value = current;

  const tagField = document.getElementById('renameTagField');
  const tagSelect = document.getElementById('renameTagSelect');
  if (type === 'role' || type === 'au') {
    const groups = type === 'role' ? ROLES.groups : AUS.groups;
    tagSelect.innerHTML = groups.map((g, i) =>
      `<option value="${i}" ${i === gi ? 'selected' : ''}>${esc(g.label)}</option>`
    ).join('');
    tagField.style.display = '';
  } else {
    tagField.style.display = 'none';
  }

  document.getElementById('renameModal').classList.add('open');
  setTimeout(() => document.getElementById('renameInput').select(), 50);
}

function closeRenameModal() {
  document.getElementById('renameModal').classList.remove('open');
  renameTarget = null;
}

function saveRename() {
  if (!renameTarget) return;
  const { type, gi, ii } = renameTarget;
  const val = document.getElementById('renameInput').value.trim();
  if (!val) return;

  if (type === 'role') {
    const newGi = parseInt(document.getElementById('renameTagSelect').value);
    ROLES.groups[gi].items.splice(ii, 1);
    ROLES.groups[newGi].items.push(val);
    closeRenameModal(); saveRoles();
  } else if (type === 'au') {
    const newGi = parseInt(document.getElementById('renameTagSelect').value);
    AUS.groups[gi].items.splice(ii, 1);
    AUS.groups[newGi].items.push(val);
    closeRenameModal(); saveAUs();
  } else if (type === 'roleTag') {
    ROLES.groups[gi].label = val;
    closeRenameModal(); saveRoles();
  } else if (type === 'auTag') {
    AUS.groups[gi].label = val;
    closeRenameModal(); saveAUs();
  }
}

async function delRole(gi, ii) {
  if (!(await customConfirm(`"${ROLES.groups[gi].items[ii]}" 삭제할까요?`))) return;
  ROLES.groups[gi].items.splice(ii, 1);
  saveRoles();
}

// ============ AUs ============
function renderAUs() {
  const total = AUS.groups.reduce((s, g) => s + g.items.length, 0);
  document.getElementById('auCount').textContent = total + '개';
  const container = document.getElementById('auList');
  if (!AUS.groups.length) {
    container.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px 0">태그가 없습니다. 태그를 먼저 추가해주세요.</div>';
    updateAUTagSelect(); return;
  }
  container.innerHTML = AUS.groups.map((g, gi) => {
    const itemsHtml = g.items.map((item, ii) => `
      <div class="simple-item">
        <span class="idx">${ii+1}</span>
        <span class="name">${esc(item)}</span>
        <button class="item-edit" onclick="openRenameModal('au',${gi},${ii})">변경</button>
        <button class="item-del" onclick="delAU(${gi},${ii})" title="삭제">✕</button>
      </div>`).join('') || '<div style="color:var(--text-muted);font-size:0.8rem;padding:4px 0">비어있음</div>';
    return `<div class="owner-section">
      <div class="owner-header">
        <span class="owner-title">${esc(g.label)}</span>
        <span style="font-size:0.65rem;color:var(--text-muted);margin-left:4px">${g.items.length}개</span>
        <button class="item-edit" style="margin-left:auto" onclick="openRenameModal('auTag',${gi})">태그 변경</button>
        <button class="danger-btn" style="font-size:0.65rem;padding:3px 10px" onclick="delAUTag(${gi})">태그 삭제</button>
      </div>
      <div class="item-list">${itemsHtml}</div>
    </div>`;
  }).join('');
  updateAUTagSelect();
}

function updateAUTagSelect() {
  document.getElementById('auTagSelect').innerHTML = AUS.groups.map(g => `<option value="${esc(g.label)}">${esc(g.label)}</option>`).join('');
}

function addAUTag() {
  const input = document.getElementById('newAUTagName');
  const label = input.value.trim();
  if (!label) return;
  if (AUS.groups.some(g => g.label === label)) { toast('이미 존재하는 태그'); return; }
  AUS.groups.push({ label, items: [] });
  input.value = '';
  saveAUs();
}

async function delAUTag(gi) {
  if (!(await customConfirm(`"${AUS.groups[gi].label}" 태그와 하위 항목을 모두 삭제할까요?`))) return;
  AUS.groups.splice(gi, 1);
  saveAUs();
}

function addAU() {
  const tagLabel = document.getElementById('auTagSelect').value;
  const input = document.getElementById('newAUName');
  const name = input.value.trim();
  if (!name) return;
  if (!tagLabel) { toast('태그를 먼저 추가해주세요'); return; }
  const g = AUS.groups.find(g => g.label === tagLabel);
  if (!g) return;
  if (g.items.includes(name)) { toast('이미 존재하는 항목'); return; }
  g.items.push(name);
  input.value = '';
  saveAUs();
}

async function delAU(gi, ii) {
  if (!(await customConfirm(`"${AUS.groups[gi].items[ii]}" 삭제할까요?`))) return;
  AUS.groups[gi].items.splice(ii, 1);
  saveAUs();
}

// ============ UTIL ============
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

init();
</script>
